name: RumiOS Custom Core Prime Build Engine

on:
  workflow_dispatch:

jobs:
  build_nougat:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Local Repository Structure
      uses: actions/checkout@v4

    - name: Clean Runner Hard Drive Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf "/usr/local/share/boost"
        df -h

    - name: Install Modern Baseline Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib gnupg gperf imagemagick libncurses-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python3-pip
        echo "deb http://security.ubuntu.com/ubuntu jammy-security main universe" | sudo tee /etc/apt/sources.list.d/jammy-lookaside.list
        sudo apt-get update
        sudo apt-get install -y libncurses5
        sudo rm /etc/apt/sources.list.d/jammy-lookaside.list
        sudo apt-get update
        sudo ln -sf /usr/bin/python3 /usr/bin/python

    - name: Deploy Secure Isolated Java 8 Environment
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '8'

    - name: Deploy Google Source Repo Binary
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Initialize LineageOS 14.1 Working Space
      run: |
        git config --global user.name "RumiOS-Automated"
        git config --global user.email "core@rumios.internal"
        mkdir -p build_workspace
        cd build_workspace
        repo init -u https://github.com/LineageOS/android.git -b cm-14.1 --git-lfs --depth=1

    - name: Purge Conflicting Local Manifests
      run: |
        rm -rf build_workspace/.repo/local_manifests

    - name: Sync Down Core Android Source Tree
      run: |
        cd build_workspace
        repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --prune --fail-fast

    - name: Direct Archive Extraction Engine (Bypass Git Protocol)
      run: |
        cd build_workspace
        
        # 1. Create directory structures
        mkdir -p device/samsung/coreprimeelte
        mkdir -p device/samsung/msm8916-common
        mkdir -p kernel/samsung/msm8916
        mkdir -p vendor/samsung
        
        # 2. Download stable source archives using curl and unzip directly into targeted structures
        echo "Downloading device trees..."
        curl -L https://github.com/vince31fr/android_device_samsung_coreprimeelte/archive/refs/heads/cm-14.1.zip -o coreprimeelte.zip
        unzip -q coreprimeelte.zip && mv android_device_samsung_coreprimeelte-cm-14.1/* device/samsung/coreprimeelte/ && rm -rf coreprimeelte.zip android_device_samsung_coreprimeelte-cm-14.1

        curl -L https://github.com/vince31fr/android_device_samsung_msm8916-common/archive/refs/heads/cm-14.1.zip -o msm8916-common.zip
        unzip -q msm8916-common.zip && mv android_device_samsung_msm8916-common-cm-14.1/* device/samsung/msm8916-common/ && rm -rf msm8916-common.zip android_device_samsung_msm8916-common-cm-14.1

        echo "Downloading kernel trees..."
        curl -L https://github.com/vince31fr/android_kernel_samsung_msm8916/archive/refs/heads/msm8916_nougat.zip -o kernel.zip
        unzip -q kernel.zip && mv android_kernel_samsung_msm8916-msm8916_nougat/* kernel/samsung/msm8916/ && rm -rf kernel.zip android_kernel_samsung_msm8916-msm8916_nougat

        echo "Downloading proprietary vendor binaries..."
        curl -L https://github.com/vince31fr/proprietary_vendor_samsung/archive/refs/heads/cm-14.1.zip -o vendor.zip
        unzip -q vendor.zip && mv proprietary_vendor_samsung-cm-14.1/* vendor/samsung/ && rm -rf vendor.zip proprietary_vendor_samsung-cm-14.1

    - name: Execute Cross-Compilation Routine
      run: |
        cd build_workspace
        source build/envsetup.sh
        export LC_ALL=C
        export USE_CCACHE=1
        ccache -M 30G
        breakfast coreprimeelte
        brunch coreprimeelte

    - name: Extract Flashed Flashable Archive Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: LineageOS-14.1-SMG360F-Custom
        path: build_workspace/out/target/product/coreprimeelte/*.zip
